name: Transcript mirror flush validation

on:
  push:
    branches: [validate/mirror-flush-20261030]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 2b3783048d8f3e43342ecf35e7bdf4da4b77492f
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Verify exact candidate
        run: test "$(git rev-parse HEAD)" = 2b3783048d8f3e43342ecf35e7bdf4da4b77492f
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Record runtime versions
        run: |
          python --version
          python -m pip freeze
      - name: Check lint
        run: python -m ruff check src/ tests/ scripts/
      - name: Check formatting
        run: python -m ruff format --check src/ tests/ scripts/
      - name: Check types
        run: python -m mypy src/ scripts/
      - name: Run unit suite
        run: python -m pytest tests/ -q
